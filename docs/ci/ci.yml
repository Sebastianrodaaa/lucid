name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install numpy pillow websockets
      - run: (cd checkpoints && sha256sum -c SHA256SUMS)
      - run: python3 test_lucid.py
